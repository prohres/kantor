name: app

# PR: lint, build and scan (no AWS access). Push to develop: build once -> deploy the digest to dev
# -> approval in the prod environment -> tag the same digest prod-<sha>.
# Manual run on develop: the same pipeline, or with image-ref only a dev deploy of that digest (rollback).
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image-ref:
        description: 'Rollback: deploy this digest to dev instead of building (<registry>/kantor@sha256:...)'
        type: string
        default: ''

permissions: {}

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a new PR commit supersedes; never cut a deploy

# Account ids and the dev URL are repo variables (Settings → Variables), not code: the repo is public.
jobs:
  build:
    if: inputs.image-ref == ''
    permissions:
      contents: read
      id-token: write
    uses: prohres/ci-templates/.github/workflows/container-build.yml@v1
    with:
      image-name: kantor
      push: ${{ github.event_name != 'pull_request' }}
      gha-role-arn: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/gha-app-build

  deploy-dev:
    needs: build
    # Build skipped only for a rollback; the digest must come from our registry
    if: >-
      always() && github.event_name != 'pull_request' && (needs.build.result == 'success'
      || (needs.build.result == 'skipped'
      && startsWith(inputs.image-ref, format('{0}.dkr.ecr.eu-central-1.amazonaws.com/kantor@sha256:', vars.CI_ACCOUNT_ID))))
    permissions:
      id-token: write
    uses: prohres/ci-templates/.github/workflows/deploy-ecs.yml@v1
    with:
      environment: dev
      image-ref: ${{ inputs.image-ref || needs.build.outputs.image-ref }}
      gha-role-arn: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/gha-app-deploy-dev
      target-role-arn: arn:aws:iam::${{ vars.DEV_ACCOUNT_ID }}:role/app-deploy
      target-account-id: ${{ vars.DEV_ACCOUNT_ID }}
      cluster: kantor-dev
      service: kantor
      task-family: kantor-dev
      container-name: web
      smoke-url: ${{ vars.DEV_URL }}/version.json
      smoke-expect: ${{ inputs.image-ref == '' && github.sha || '' }} # a rollback runs an older commit

  promote-prod:
    needs: [build, deploy-dev]
    if: inputs.image-ref == '' # a rollback in dev promotes nothing
    permissions:
      id-token: write
    uses: prohres/ci-templates/.github/workflows/promote-ecr.yml@v1
    with:
      environment: prod
      image-ref: ${{ needs.build.outputs.image-ref }}
      tag: prod-${{ github.sha }}
      gha-role-arn: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/gha-app-promote
